---
# Optional — installs Postgres on the managed server when a template's manifest declares requires.postgres = true.
- name: postgres — install
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

- name: postgres — enable + start
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

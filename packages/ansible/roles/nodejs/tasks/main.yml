---
# Installs Node.js LTS via NodeSource. Phase 5's Next.js templates need this.
- name: nodejs — NodeSource key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.gpg.key
    mode: "0644"
    force: false

- name: nodejs — convert key to keyring
  ansible.builtin.shell: |
    gpg --dearmor < /etc/apt/keyrings/nodesource.gpg.key > /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: nodejs — apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main"
    filename: nodesource
    state: present

- name: nodejs — install
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: nodejs — install pnpm globally
  ansible.builtin.shell: |
    npm install -g pnpm@9
  args:
    creates: /usr/bin/pnpm

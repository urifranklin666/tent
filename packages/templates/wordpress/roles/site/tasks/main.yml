---
# Deploys WordPress + MariaDB on the target server via Docker Compose.
# Required tent-passed extra-vars:
#   site_slug, site_domain, site_port
#   var_site_title
#   var_admin_email
#   var_db_password    (secret — never logged)

- name: site dir
  ansible.builtin.file:
    path: "/var/lib/tent/sites/{{ site_slug }}"
    state: directory
    owner: "{{ tent_operator_user }}"
    group: "{{ tent_operator_user }}"
    mode: "0755"

- name: wp-content dir (persisted on host)
  ansible.builtin.file:
    path: "/var/lib/tent/sites/{{ site_slug }}/wp-content"
    state: directory
    owner: "{{ tent_operator_user }}"
    group: "{{ tent_operator_user }}"
    mode: "0755"

- name: compose — render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/var/lib/tent/sites/{{ site_slug }}/docker-compose.yml"
    owner: "{{ tent_operator_user }}"
    group: "{{ tent_operator_user }}"
    mode: "0600"
    no_log: true

- name: docker compose — pull images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "/var/lib/tent/sites/{{ site_slug }}"
  register: compose_pull
  changed_when: "'Downloaded' in compose_pull.stdout or 'Pull complete' in compose_pull.stdout"

- name: docker compose — up
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "/var/lib/tent/sites/{{ site_slug }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout or 'Recreated' in compose_up.stdout"

- name: wait for wordpress to respond
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ site_port }}/wp-login.php"
    status_code: [200, 301, 302]
  register: probe
  retries: 30
  delay: 3
  until: probe.status in [200, 301, 302]
